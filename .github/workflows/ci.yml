name: ci

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: 'ci-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/pnpm-install.log

      - name: Install summary
        if: always()
        run: node tools/scripts/install/summary.mjs /tmp/pnpm-install.log

      - name: Run lint
        run: pnpm run lint

  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @chesspecker/web test

      - name: Build application
        run: |
          set -o pipefail
          pnpm --filter @chesspecker/web build 2>&1 | tee /tmp/build.log

      - name: Build summary
        if: always()
        run: node tools/scripts/build/summary.mjs /tmp/build.log

  api:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Register tsc problem matcher
        run: echo "::add-matcher::.github/matchers/tsc.json"

      - name: Run typecheck
        run: pnpm exec tsc --noEmit -p apps/api/tsconfig.json

      - name: Run tests
        run: pnpm --filter @chesspecker/api test

      - name: Build application
        run: pnpm --filter @chesspecker/api build
