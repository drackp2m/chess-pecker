name: deploy

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: 'deploy'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # No lint or test here: ci.yml already ran them against the merge result, and
  # the ruleset on main only lets a pull request through, so anything landing
  # here is code those checks passed. Repeating them would just delay the
  # release by two runners' worth of checkout + install.
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.SEMANTIC_RELEASE_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" > private.key
          gpg --batch --import private.key
          git config --global commit.gpgSign true
          git config --global user.signingkey 8061777E7D988EE9
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent

      # Not GITHUB_TOKEN: @semantic-release/git pushes the release commit
      # straight to main, and the ruleset there requires a pull request. Bypass
      # actors can be roles, teams or GitHub Apps — never Actions itself — so
      # the push goes as romantic-release-bot, a collaborator whose role is on
      # the ruleset's bypass list. The commit is signed with its GPG key either
      # way; only the pusher changes.
      - name: Run semantic-release
        env:
          HUSKY: 0
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          GIT_AUTHOR_NAME: 'romantic-release-bot'
          GIT_AUTHOR_EMAIL: '187212958+romantic-release-bot@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'romantic-release-bot'
          GIT_COMMITTER_EMAIL: '187212958+romantic-release-bot@users.noreply.github.com'
        run: |
          set -o pipefail
          pnpm exec semantic-release --verbose 2>&1 | tee /tmp/semantic-release.log

      - name: Release summary
        if: always()
        run: node tools/scripts/release/summary.mjs /tmp/semantic-release.log

  build:
    runs-on: ubuntu-24.04
    needs: release
    permissions:
      contents: read
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pull latest changes
        run: git pull origin main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: |
          set -o pipefail
          pnpm --filter @chesspecker/web build --base-href ${{ steps.pages.outputs.base_url }}/ 2>&1 | tee /tmp/build.log

      - name: Build summary
        if: always()
        run: node tools/scripts/build/summary.mjs /tmp/build.log

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './apps/web/dist/chesspecker/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
