services:
  chesspecker-db:
    container_name: chesspecker-db
    hostname: chesspecker-db
    image: postgres:18-alpine3.23
    ports:
      - ${DB_PORT}:5432
    volumes:
      - .pgdata:/var/lib/postgresql/data/pgdata
      - ./tools/container/postgresql-multiple-databases.sh:/docker-entrypoint-initdb.d/generate-databases.sh:ro
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: ${DB_PASS}
      DB_USER: ${DB_USER}
      DB_NAMES: ${DB_NAME},${DB_NAME_TEST}
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  chesspecker-node:
    container_name: chesspecker-node
    hostname: chesspecker-node
    working_dir: /usr/src/app
    image: chesspecker-node:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-attached
    env_file:
      - .env
    ports:
      - ${APP_PORT}:4200
      - ${API_PORT}:3000
      - ${API_DEBUG_PORT}:9229
    volumes:
      - .:/usr/src/app
      # One volume per workspace package: pnpm gives each its own node_modules,
      # and the bind mount above would otherwise hide the ones baked in the image.
      - node_modules:/usr/src/app/node_modules
      - web_node_modules:/usr/src/app/apps/web/node_modules
      - api_node_modules:/usr/src/app/apps/api/node_modules
    environment:
      # Relative to the MikroORM CLI's cwd, which `pnpm --filter @chesspecker/api`
      # puts at apps/api — the same place mikro-orm.config.ts resolves its entity
      # and migration globs from. Running the CLI by hand from the repo root finds
      # nothing; always go through the package scripts.
      MIKRO_ORM_CLI_CONFIG: src/shared/module/config/mikro-orm.config.ts
      MIKRO_ORM_CLI_TS_CONFIG_PATH: tsconfig.json
      MIKRO_ORM_CLI_ALWAYS_ALLOW_TS: 1
      MIKRO_ORM_CLI_USE_TS_NODE: 1
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      PATH: $PATH:/usr/src/app/node_modules/.bin
      NG_HMR_TEMPLATES: 1
      TZ: UTC
    depends_on:
      chesspecker-db:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  node_modules:
  web_node_modules:
  api_node_modules:
