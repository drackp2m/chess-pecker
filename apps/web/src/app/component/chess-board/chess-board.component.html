<div
	#board
	class="board"
	[class.waiting]="store.isBusy()"
	[class.locked]="store.isLocked()"
	[class.dragging]="undefined !== draggingFrom()"
	(pointermove)="dragSquare($event)"
	(pointerup)="dropSquare($event)"
	(pointercancel)="cancelDrag()"
>
	@for (square of squares(); track square.square) {
		<button
			type="button"
			class="square"
			[class.light]="square.isLight"
			[class.dark]="!square.isLight"
			[class.selected]="square.isSelected"
			[class.target]="square.isTarget"
			[class.capture]="square.isCapture"
			[class.last-move]="square.isLastMove"
			[class.checked]="square.isChecked"
			[class.mistake]="square.isMistake"
			[class.announced]="square.isAnnounced"
			[class.lifted]="square.square === draggingFrom()"
			[attr.aria-label]="label(square)"
			[attr.aria-disabled]="store.isLocked()"
			(pointerdown)="pressSquare(square, $event)"
			(click)="activate(square, $event)"
		>
			@if (square.piece; as piece) {
				<app-chess-piece [type]="piece.type" [color]="piece.color" [slide]="square.slide" />
			}

			@if (square.rankLabel; as rank) {
				<span class="coordinate rank" aria-hidden="true">{{ rank }}</span>
			}

			@if (square.fileLabel; as file) {
				<span class="coordinate file" aria-hidden="true">{{ file }}</span>
			}
		</button>
	}

	@if (ghost(); as dragged) {
		<app-chess-piece
			class="ghost"
			[type]="dragged.piece.type"
			[color]="dragged.piece.color"
			[style.left.px]="dragged.x"
			[style.top.px]="dragged.y"
			[style.width.px]="dragged.size"
			[style.height.px]="dragged.size"
		/>
	}

	@if (store.pendingPromotion(); as promotion) {
		<div class="promotion" role="dialog" aria-label="Choose a promotion piece">
			<p class="promotion-title">Promote to</p>

			<div class="promotion-board">
				@for (choice of promotionChoices; track choice.piece) {
					<button
						type="button"
						class="promotion-square"
						[class.light]="choice.isLight"
						[class.dark]="!choice.isLight"
						[attr.aria-label]="'Promote to ' + choice.piece"
						(click)="promote(choice.piece)"
					>
						<app-chess-piece [type]="choice.piece" [color]="promotionColor()" />

						@if (choice.rankLabel; as rank) {
							<span class="coordinate rank" aria-hidden="true">{{ rank }}</span>
						}

						@if (choice.fileLabel; as file) {
							<span class="coordinate file" aria-hidden="true">{{ file }}</span>
						}
					</button>
				}
			</div>

			<button type="button" class="promotion-cancel" (click)="store.cancelPromotion()">
				Cancel
			</button>
		</div>
	}
</div>
