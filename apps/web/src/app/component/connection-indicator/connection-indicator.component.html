@if (message(); as text) {
	<span
		class="connection-indicator flex-row gap-2 align-center"
		role="status"
		[title]="detail() | i18n"
	>
		<span class="label fs-sm">{{ text | i18n }}</span>

		@if (canRetry()) {
			<button appThemed color="accent" class="retry fs-sm p-0 px-2" (click)="retry()">
				{{ I18n.common.RETRY | i18n }}
			</button>
		}
	</span>
}
