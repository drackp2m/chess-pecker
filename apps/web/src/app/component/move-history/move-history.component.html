@if (0 === turns().length) {
	<p class="fs-sm color-contrast-mid">No moves yet.</p>
} @else {
	<ol class="flex-col gap-1">
		@for (turn of turns(); track turn.number) {
			<li class="turn gap-2 align-base py-1 px-2 br-1">
				<span class="fs-sm color-contrast-mid">{{ turn.number }}.</span>
				<span class="fw-lg">{{ turn.white ?? '…' }}</span>
				<span class="fw-lg">{{ turn.black ?? '' }}</span>
			</li>
		}
	</ol>
}
