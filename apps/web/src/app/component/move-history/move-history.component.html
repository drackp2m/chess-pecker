@if (0 === turns().length) {
	<p class="empty color-contrast-mid">No moves yet.</p>
} @else {
	<ol class="turns">
		@for (turn of turns(); track turn.number) {
			<li class="turn">
				<span class="number color-contrast-mid">{{ turn.number }}.</span>
				<span class="move">{{ turn.white ?? '…' }}</span>
				<span class="move">{{ turn.black ?? '' }}</span>
			</li>
		}
	</ol>
}
