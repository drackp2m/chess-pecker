<section class="flex-col gap-4">
	<header class="flex-col gap-1">
		<h4 class="color-contrast-mid">{{ label() }}</h4>

		<div class="flex-row justify-between align-center gap-2">
			<p
				class="headline fs-lg fw-lg"
				[class.failed]="'failed' === board.result()"
				[class.solved]="'solved' === board.result()"
			>
				{{ headline() }}
			</p>

			<app-puzzle-difficulty />
		</div>
	</header>

	@if (practiceNotice(); as message) {
		<p class="fs-sm color-contrast-mid" role="status">{{ message }}</p>
	}

	@if (run.error(); as message) {
		<p class="error fs-sm" role="alert">{{ message }}</p>
	}

	@if (run.notice(); as message) {
		<p class="fs-sm" role="status">{{ message }}</p>
	}

	@if (null !== run.current()) {
		<app-puzzle-solver />
	}

	<div class="flex-row flex-wrap gap-2 align-center justify-between">
		<button appThemed appRouterLink="/training">Back to the training</button>

		@if (run.hasNext()) {
			<button appThemed color="accent" [disabled]="run.isBusy()" (click)="next()">
				Next exercise
			</button>
		} @else if (run.hasNextRound()) {
			<button appThemed color="accent" [disabled]="run.isBusy()" (click)="nextRound()">
				Next round
			</button>
		}
	</div>
</section>
