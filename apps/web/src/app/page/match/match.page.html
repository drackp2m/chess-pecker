<section class="flex-col gap-4">
	<header class="flex-col gap-1">
		<h4 class="title color-contrast-mid">Playing <span class="color-contrast">match</span></h4>

		<p class="headline" [class.check]="isCheck()">
			{{ headline() }}

			@if (isCheck() && !store.isFinished()) {
				<span class="badge">Check</span>
			}
		</p>
	</header>

	<div class="layout">
		<app-chess-board />

		<aside class="panel flex-col gap-4">
			<div class="flex-col gap-2">
				<h5>Side</h5>

				<div class="flex-row gap-2">
					<button
						appThemed
						[color]="'white' === store.playerColor() ? 'accent' : 'primary-mid'"
						(click)="playAs('white')"
					>
						Play as white
					</button>

					<button
						appThemed
						[color]="'black' === store.playerColor() ? 'accent' : 'primary-mid'"
						(click)="playAs('black')"
					>
						Play as black
					</button>
				</div>

				<p class="hint color-contrast-mid">Choosing a side starts a new match.</p>
			</div>

			<div class="flex-col gap-2">
				<h5>Board</h5>

				<div class="flex-row gap-2">
					<button appThemed (click)="store.flipBoard()">Flip board</button>

					<button
						appThemed
						[disabled]="0 === store.history().length"
						(click)="store.undoLastMove()"
					>
						Undo move
					</button>
				</div>
			</div>

			<div class="flex-col gap-2">
				<h5>Exercise position</h5>

				<input
					appThemed
					type="text"
					label="FEN"
					placeholder="8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1"
					[value]="fenDraft()"
					(input)="updateFenDraft($event)"
				/>

				<button appThemed color="accent" [disabled]="'' === fenDraft().trim()" (click)="loadFen()">
					Load position
				</button>

				<p class="fen color-contrast-mid">{{ store.fen() }}</p>
			</div>

			<div class="flex-col gap-2">
				<h5>Moves</h5>

				<app-move-history />
			</div>
		</aside>
	</div>

	@if (store.notationError(); as error) {
		<p class="error" role="alert">
			{{ error }}

			<button type="button" class="dismiss" (click)="store.dismissError()">Dismiss</button>
		</p>
	}
</section>
