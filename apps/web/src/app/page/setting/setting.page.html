<section class="flex-col gap-6">
	<div class="flex-col gap-2">
		<h4>Appearance</h4>

		<form [formGroup]="form" class="flex-col gap-1">
			<input appThemed type="radio" label="System" value="system" formControlName="appearance" />
			<input appThemed type="radio" label="Light" value="light" formControlName="appearance" />
			<input appThemed type="radio" label="Dark" value="dark" formControlName="appearance" />
		</form>
	</div>

	<div class="flex-col gap-2">
		<h4>Move animation</h4>

		<p class="fs-sm color-contrast-mid">How much of the board's movement slides into place.</p>

		<form [formGroup]="form" class="flex-col gap-1">
			@for (animation of moveAnimations; track animation) {
				<input
					appThemed
					type="radio"
					[label]="animationLabel[animation]"
					[value]="animation"
					formControlName="moveAnimation"
				/>
			}
		</form>
	</div>

	<div class="flex-col gap-2">
		<h4>Move input</h4>

		<p class="fs-sm color-contrast-mid">
			How you enter a move. Turning both off keeps clicking, so the board stays playable.
		</p>

		<form [formGroup]="form" class="flex-col gap-1">
			<input appThemed type="checkbox" [label]="inputLabel.click" formControlName="clickToMove" />

			<input appThemed type="checkbox" [label]="inputLabel.drag" formControlName="dragToMove" />
		</form>
	</div>

	<p class="flex-row flex-grow justify-center align-end mono fs-sm">version {{ VERSION }}</p>
</section>
