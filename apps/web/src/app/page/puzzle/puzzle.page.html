<section class="flex-col gap-4">
	@if (store.puzzle(); as puzzle) {
		<header class="flex-col gap-1">
			<h4 class="title color-contrast-mid">
				Solving

				<span class="color-contrast">{{ puzzle.id }}</span> · {{ counter() }}
			</h4>

			<div class="flex-row justify-between align-center gap-2">
				<p
					class="headline fs-lg fw-lg"
					[class.failed]="'failed' === store.outcome()"
					[class.solved]="'solved' === store.outcome()"
				>
					{{ headline() }}
				</p>

				<app-puzzle-difficulty />
			</div>
		</header>
	}

	<app-puzzle-solver
		previousLabel="Previous exercise"
		nextLabel="Next exercise"
		[isPreviousDisabled]="!store.library.hasPrevious()"
		[isNextDisabled]="!store.library.hasNext()"
		(previous)="store.previousPuzzle()"
		(next)="store.nextPuzzle()"
	/>

	<details class="import p-3 br-2" [open]="0 === store.library.puzzles().length">
		<summary class="fw-xl">Load exercises</summary>

		<div class="flex-col gap-2 mt-3">
			<label class="fs-sm" for="puzzle-csv">Paste CSV rows</label>

			<textarea
				id="puzzle-csv"
				class="mono fs-sm p-2 br-1 color-contrast"
				rows="4"
				spellcheck="false"
				placeholder="PuzzleId,FEN,Moves,Rating,…"
				[value]="csvDraft()"
				(input)="updateDraft($event)"
			></textarea>

			<div class="flex-row flex-wrap gap-2">
				<button
					appThemed
					color="accent"
					[disabled]="'' === csvDraft().trim()"
					(click)="loadDraft()"
				>
					Load CSV
				</button>

				<button appThemed (click)="loadSample()">Use sample row</button>

				<label
					class="file-button align-center py-2 px-4 br-1 fw-lg color-contrast"
					for="puzzle-file"
					>Choose a .csv file</label
				>

				<input
					id="puzzle-file"
					type="file"
					accept=".csv,text/csv"
					class="file-input"
					(change)="loadFile($event)"
				/>
			</div>

			@if (store.library.importError(); as error) {
				<p class="error fs-sm" role="alert">{{ error }}</p>
			}

			@if (store.library.importNotice(); as notice) {
				<p class="fs-sm">{{ notice }}</p>
			}
		</div>
	</details>
</section>
