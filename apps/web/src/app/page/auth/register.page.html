<section class="flex-col gap-4">
	<header class="flex-col gap-1">
		<h4>{{ I18n.common.CREATE_ACCOUNT | i18n }}</h4>

		<p class="fs-sm color-contrast-mid">{{ I18n.auth.REGISTER_INTRO | i18n }}</p>
	</header>

	<form [formGroup]="form" class="flex-col gap-3" (ngSubmit)="submit()">
		<input
			appThemed
			type="text"
			[label]="I18n.auth.USERNAME | i18n"
			autocomplete="username"
			formControlName="username"
		/>

		<input
			appThemed
			type="email"
			[label]="I18n.auth.EMAIL_OPTIONAL | i18n"
			autocomplete="email"
			formControlName="email"
		/>

		<input
			appThemed
			type="password"
			[label]="I18n.auth.PASSWORD | i18n"
			autocomplete="new-password"
			formControlName="password"
		/>

		<p class="fs-sm color-contrast-mid">
			{{ I18n.auth.PASSWORD_MIN_LENGTH | i18n: { length: minPasswordLength } }}
		</p>

		@if (error(); as message) {
			<p class="error fs-sm" role="alert">{{ message.key | i18n: message.params }}</p>
		}

		<button appThemed type="submit" color="accent" [disabled]="isSubmitting()">
			{{ (isSubmitting() ? I18n.auth.CREATING_ACCOUNT : I18n.common.CREATE_ACCOUNT) | i18n }}
		</button>
	</form>

	<div class="flex-row flex-wrap gap-2 align-center">
		<p class="fs-sm color-contrast-mid">{{ I18n.auth.ALREADY_REGISTERED | i18n }}</p>

		<button appThemed appRouterLink="/login">{{ I18n.common.LOG_IN | i18n }}</button>
	</div>
</section>
