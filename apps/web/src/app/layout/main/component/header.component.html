<section class="header force-light pb-2 px-4 surface-contrast color-primary">
	<span class="side start flex-row align-center">
		@if (backLink(); as link) {
			<button
				class="back flex-row align-center color-primary"
				[attr.aria-label]="I18n.common.BACK | i18n"
				(click)="goBack(link)"
			>
				<app-svg icon="chevron-left" [size]="18" />
			</button>
		}
	</span>

	<h3 class="title">
		@if (titleKey(); as key) {
			{{ key | i18n }}
		} @else {
			Chess Pecker
		}
	</h3>

	<span class="side end flex-row gap-2 align-center">
		<app-sync-indicator />

		<ng-content>
			@if (hasNotice()) {
				<app-connection-indicator />
			}
		</ng-content>
	</span>
</section>
