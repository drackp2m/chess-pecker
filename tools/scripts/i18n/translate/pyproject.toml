[project]
name = "chesspecker-translate"
version = "0.1.0"
description = "Translate the Chesspecker XLIFF catalogue with a local model"
requires-python = ">=3.11"
dependencies = [
	"lxml>=5.3",
	"huggingface-hub>=0.34",
	"requests>=2.32",
	"mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
translate = "translator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["translator"]
